name: iOS Commit Build

# Builds a sideloadable IPA for every pushed commit. Commits on the release
# branch (`main`) each get their own pre-release, while the SideStore/AltStore source
# lives on the `sidestore` branch,
# reachable at:
#   https://raw.githubusercontent.com/<owner>/<repo>/sidestore/apps.json
# A git push swaps the file atomically, so SideStore never sees a half-written
# source. Old IPA downloads remain valid when a newer build arrives.

on:
  push:
    branches: [main]
    # Docs-only commits change nothing in the app.
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: write

# Preserve all release-branch builds: each must finish publishing its own
# iOS release and SideStore source. Supersede in-flight feature-branch builds.
# The release branch is named explicitly rather than read from the repository's
# default-branch setting, so publishing does not depend on that setting.
concurrency:
  group: ios-commit-${{ github.ref_name == 'main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

env:
  SOURCE_BRANCH: sidestore

jobs:
  build:
    # macos-latest is an arm64 runner. GitHub repeatedly cancelled this repo's
    # jobs after 15 minutes because no arm64 capacity became available. Use the
    # standard Intel image, which has the same 14 GB memory allocation.
    runs-on: macos-26-intel
    outputs:
      ipa_name: ${{ steps.ipa.outputs.name }}
      release_tag: ${{ steps.publish.outputs.release_tag }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # Full history (without blobs) so the changelog can list every commit
        # since the previous published build.
        fetch-depth: 0
        filter: blob:none

    # Optional here (unlike the release workflow) so forks and branches
    # without the secret still get a build; TMDB metadata is just disabled.
    - name: Configure TMDB build token
      shell: python
      env:
        TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      run: |
        import json, os
        from pathlib import Path
        token = os.environ.get("TMDB_READ_ACCESS_TOKEN", "").strip()
        config = {}
        if token:
            config["TMDB_READ_ACCESS_TOKEN"] = token
        else:
            print("::warning::TMDB_READ_ACCESS_TOKEN is not set; building without TMDB metadata")
        omdb = os.environ.get("OMDB_API_KEY", "").strip()
        if omdb:
            config["OMDB_API_KEY"] = omdb
        # The app's update check compares its own build number with the
        # build-<number>-<sha> releases this workflow publishes.
        config["NEXTUP_BUILD_NUMBER"] = os.environ["GITHUB_RUN_NUMBER"]
        config["NEXTUP_COMMIT"] = os.environ["GITHUB_SHA"]
        path = Path(os.environ["RUNNER_TEMP"]) / "debrify-build-config.json"
        path.write_text(json.dumps(config), encoding="utf-8")

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.8'
        channel: 'stable'
        cache: true

    - name: Cache CocoaPods
      uses: actions/cache@v4
      with:
        path: ios/Pods
        key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
        restore-keys: ${{ runner.os }}-pods-

    - name: Get dependencies
      run: flutter pub get

    # A UTC timestamp gives every commit a strictly increasing CFBundleVersion
    # that is always above pubspec's small +N build numbers (and so above any
    # release IPA already installed), so SideStore sees each build as an update.
    - name: Build iOS (unsigned)
      run: >
        flutter build ios --release --no-codesign
        --build-number=$(date -u +%Y%m%d%H%M)
        --dart-define=DEBRIFY_LOCAL_VALIDATION=false
        --dart-define-from-file="${{ runner.temp }}/debrify-build-config.json"

    # --no-codesign emits Mach-Os with no LC_CODE_SIGNATURE, so __LINKEDIT has no
    # room reserved for a signature and SideStore/ldid abort. Ad-hoc signing
    # reserves that space; SideStore replaces it with the user's own cert.
    - name: Ad-hoc sign for sideloading
      run: |
        set -euo pipefail
        APP=build/ios/iphoneos/Runner.app
        for d in "$APP"/Frameworks/*.dylib; do
          [ -f "$d" ] && codesign -f -s - --timestamp=none "$d"
        done
        for f in "$APP"/Frameworks/*.framework; do
          [ -d "$f" ] && codesign -f -s - --timestamp=none "$f"
        done
        codesign -f -s - --timestamp=none "$APP"

        missing=0
        check() {
          if [ -f "$1" ] && [ "$(otool -l "$1" | grep -c LC_CODE_SIGNATURE)" -eq 0 ]; then
            echo "::error::no LC_CODE_SIGNATURE in $1"
            missing=$((missing + 1))
          fi
        }
        check "$APP/Runner"
        for d in "$APP"/Frameworks/*.dylib; do check "$d"; done
        for f in "$APP"/Frameworks/*.framework; do
          check "$f/$(basename "$f" .framework)"
        done
        if [ "$missing" -ne 0 ]; then
          echo "::error::$missing binary(ies) left unsigned; IPA would not sideload"
          exit 1
        fi

    - name: Package IPA
      id: ipa
      run: |
        set -euo pipefail
        NAME="nextup-ios-${{ github.run_number }}-${GITHUB_SHA::7}.ipa"
        cd build/ios/iphoneos
        rm -rf Payload && mkdir Payload
        cp -R Runner.app Payload/
        zip -qry "$NAME" Payload
        rm -rf Payload
        echo "name=$NAME" >> "$GITHUB_OUTPUT"

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: nextup-ios-${{ github.run_number }}
        path: build/ios/iphoneos/${{ steps.ipa.outputs.name }}

    - name: Publish commit release and SideStore source
      id: publish
      if: github.ref_name == 'main'
      env:
        GH_TOKEN: ${{ github.token }}
        IPA_NAME: ${{ steps.ipa.outputs.name }}
        COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
      run: |
        set -euo pipefail
        COMMIT_MESSAGE="${COMMIT_MESSAGE:-$(git log -1 --pretty=%B)}"
        IPA="build/ios/iphoneos/$IPA_NAME"
        RELEASE_TAG="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
        BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG"
        SOURCE_URL="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$SOURCE_BRANCH/apps.json"

        if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
          gh release create "$RELEASE_TAG" --prerelease --target "$GITHUB_SHA" \
            --title "Nextup build #$GITHUB_RUN_NUMBER (${GITHUB_SHA::7})" \
            --notes "Commit $GITHUB_SHA on $GITHUB_REF_NAME. iOS IPA and SideStore source publication is in progress. Automatic Android and Android TV builds are paused pending a stable release signing key."
        fi

        # Each build's release tag and IPA name are unique and stay addressable.
        gh release upload "$RELEASE_TAG" "$IPA" --clobber
        echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

        # The source lives alone on an orphan branch.
        SRC="$RUNNER_TEMP/sidestore"
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        for attempt in 1 2 3 4 5; do
          rm -rf "$SRC"
          if git ls-remote --exit-code origin "refs/heads/$SOURCE_BRANCH" >/dev/null; then
            git clone -q --depth 2 --branch "$SOURCE_BRANCH" \
              "https://x-access-token:${GH_TOKEN}@github.com/$GITHUB_REPOSITORY.git" "$SRC"
            PREVIOUS="$SRC/apps.json"
          else
            git init -q -b "$SOURCE_BRANCH" "$SRC"
            git -C "$SRC" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/$GITHUB_REPOSITORY.git"
            # First run: carry over the previous SideStore source if available.
            mkdir -p "$RUNNER_TEMP/prev"
            gh release download "$RELEASE_TAG" -p apps.json -D "$RUNNER_TEMP/prev" --clobber || true
            PREVIOUS="$RUNNER_TEMP/prev/apps.json"
          fi

          # Writes to a temp file and only replaces apps.json once the result
          # has passed validation, so a bad build can't publish a bad source.
          python3 .github/scripts/sidestore_source.py \
            --app build/ios/iphoneos/Runner.app \
            --ipa "$IPA" \
            --download-url "$BASE/$IPA_NAME" \
            --previous "$PREVIOUS" \
            --output "$SRC/apps.json" \
            --repo "$GITHUB_REPOSITORY" \
            --branch "$GITHUB_REF_NAME" \
            --sha "$GITHUB_SHA" \
            --commit-message "$COMMIT_MESSAGE"

          git -C "$SRC" add apps.json
          git -C "$SRC" commit -q -m "Publish build ${{ github.run_number }} from ${GITHUB_SHA::7}"
          # Another commit's build may have published meanwhile: rebuild on top.
          if git -C "$SRC" push -q origin "HEAD:refs/heads/$SOURCE_BRANCH"; then
            break
          fi
          [ "$attempt" -lt 5 ] || { echo "::error::could not publish the source"; exit 1; }
          sleep $((attempt * 3))
        done

        printf 'Commit %s on %s.\n\n**iOS:** %s\n**Android / Android TV:** automatic builds are paused until a stable release signing key is available.\n\n**SideStore source:** %s\n' \
          "$GITHUB_SHA" "$GITHUB_REF_NAME" "$IPA_NAME" "$SOURCE_URL" > "$RUNNER_TEMP/nextup-release-notes.md"
        gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/nextup-release-notes.md"

        echo "### SideStore source" >> "$GITHUB_STEP_SUMMARY"
        echo "\`$SOURCE_URL\`" >> "$GITHUB_STEP_SUMMARY"

  # Desktop builds of the same commit, attached to the release the iOS job
  # just published (same run number, so the same build-<number>-<sha> tag).
  # The app's update check downloads these and installs them in place.
  macos:
    needs: build
    if: github.ref_name == 'main' && needs.build.outputs.release_tag != ''
    # The pinned native dependency set predates Xcode 26 (see build.yml).
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure build defines
      shell: python
      env:
        TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      run: |
        import json, os
        from pathlib import Path
        config = {
            "NEXTUP_BUILD_NUMBER": os.environ["GITHUB_RUN_NUMBER"],
            "NEXTUP_COMMIT": os.environ["GITHUB_SHA"],
        }
        for key in ("TMDB_READ_ACCESS_TOKEN", "OMDB_API_KEY"):
            value = os.environ.get(key, "").strip()
            if value:
                config[key] = value
        path = Path(os.environ["RUNNER_TEMP"]) / "nextup-build-config.json"
        path.write_text(json.dumps(config), encoding="utf-8")

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.8'
        channel: 'stable'
        cache: true

    - name: Install Nix for pinned libmpv build
      uses: DeterminateSystems/nix-installer-action@v22
      with:
        extra-conf: |
          sandbox = true
          sandbox-fallback = false

    - name: Cache native build dependencies
      uses: DeterminateSystems/magic-nix-cache-action@v13
      with:
        use-flakehub: false

    - name: Get dependencies
      run: flutter pub get

    - name: Build PGS-capable MediaKit frameworks
      run: dev/scripts/build_macos_media_kit_frameworks.sh packages/media_kit_libs_macos_video_patched/macos/Frameworks

    - name: Build macOS app
      run: flutter build macos --release --dart-define=DEBRIFY_LOCAL_VALIDATION=false --dart-define-from-file="${{ runner.temp }}/nextup-build-config.json"

    - name: Verify packaged subtitle decoders
      run: dev/scripts/verify_macos_subtitle_decoders.sh build/macos/Build/Products/Release/Nextup.app/Contents/Frameworks

    # A zip, not a DMG: the app unpacks it with ditto and swaps the bundle.
    - name: Package and publish
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        cd build/macos/Build/Products/Release
        ZIP="nextup-${RELEASE_TAG}-macos.zip"
        /usr/bin/ditto -c -k --sequesterRsrc --keepParent Nextup.app "$ZIP"
        gh release upload "$RELEASE_TAG" "$ZIP" --clobber --repo "$GITHUB_REPOSITORY"

  windows:
    needs: build
    if: github.ref_name == 'main' && needs.build.outputs.release_tag != ''
    runs-on: windows-2022
    env:
      RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure build defines
      shell: python
      env:
        TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      run: |
        import json, os
        from pathlib import Path
        config = {
            "NEXTUP_BUILD_NUMBER": os.environ["GITHUB_RUN_NUMBER"],
            "NEXTUP_COMMIT": os.environ["GITHUB_SHA"],
        }
        for key in ("TMDB_READ_ACCESS_TOKEN", "OMDB_API_KEY"):
            value = os.environ.get(key, "").strip()
            if value:
                config[key] = value
        path = Path(os.environ["RUNNER_TEMP"]) / "nextup-build-config.json"
        path.write_text(json.dumps(config), encoding="utf-8")

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.8'
        channel: 'stable'
        cache: true

    - name: Enable Windows desktop
      run: flutter config --enable-windows-desktop

    - name: Get dependencies
      run: flutter pub get

    - name: Build Windows app
      run: flutter build windows --release --dart-define=DEBRIFY_LOCAL_VALIDATION=false --dart-define-from-file="${{ runner.temp }}/nextup-build-config.json"

    - name: Install Inno Setup
      run: choco install innosetup --no-progress --yes

    - name: Build installer and publish
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $env:DEBRIFY_VERSION = $env:RELEASE_TAG
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\installer.iss
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        gh release upload $env:RELEASE_TAG "build/windows/installer/nextup-$($env:RELEASE_TAG)-setup.exe" --clobber --repo $env:GITHUB_REPOSITORY

  linux:
    needs: build
    if: github.ref_name == 'main' && needs.build.outputs.release_tag != ''
    # Pinned for its glibc floor (see build.yml).
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure build defines
      shell: python
      env:
        TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      run: |
        import json, os
        from pathlib import Path
        config = {
            "NEXTUP_BUILD_NUMBER": os.environ["GITHUB_RUN_NUMBER"],
            "NEXTUP_COMMIT": os.environ["GITHUB_SHA"],
        }
        for key in ("TMDB_READ_ACCESS_TOKEN", "OMDB_API_KEY"):
            value = os.environ.get(key, "").strip()
            if value:
                config[key] = value
        path = Path(os.environ["RUNNER_TEMP"]) / "nextup-build-config.json"
        path.write_text(json.dumps(config), encoding="utf-8")

    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libasound2-dev libpulse-dev libva-dev libvdpau-dev libxpresent-dev patchelf

    - name: Build private libmpv
      run: |
        mkdir -p build
        docker run --rm \
          -v "$PWD:/src" \
          -w /src \
          ubuntu:22.04 \
          bash -euxo pipefail -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y \
              build-essential git pkg-config ninja-build python3-pip nasm yasm \
              autoconf automake libtool-bin libssl-dev zlib1g-dev \
              libasound2-dev libpulse-dev libva-dev libvdpau-dev \
              libgl-dev libegl-dev libx11-dev libxext-dev libxrandr-dev \
              libxss-dev libxpresent-dev libdrm-dev libgbm-dev \
              libwayland-dev wayland-protocols libxkbcommon-dev \
              libfontconfig1-dev libfreetype6-dev libharfbuzz-dev \
              libfribidi-dev python3-jinja2 python3-docutils
            python3 -m pip install --no-cache-dir meson==1.7.0
            dev/scripts/build_linux_libmpv.sh build/private-libmpv
          '

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.8'
        channel: 'stable'
        cache: true

    - name: Enable Linux desktop
      run: flutter config --enable-linux-desktop

    - name: Get dependencies
      run: flutter pub get

    - name: Build Linux app
      run: PKG_CONFIG_PATH="$PWD/build/private-libmpv/pkgconfig" flutter build linux --release --dart-define=DEBRIFY_LOCAL_VALIDATION=false --dart-define-from-file="${{ runner.temp }}/nextup-build-config.json"

    - name: Install private libmpv into the app bundle
      run: dev/scripts/bundle_linux_mpv.sh build/linux/x64/release/bundle build/private-libmpv

    - name: Create AppImage and publish
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
        chmod +x appimagetool-x86_64.AppImage

        mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/512x512/apps AppDir/usr/share/applications
        cp -r build/linux/x64/release/bundle/* AppDir/usr/bin/
        cp assets/icon/app_icon_rounded.png AppDir/usr/share/icons/hicolor/512x512/apps/nextup.png
        cp assets/icon/app_icon_rounded.png AppDir/nextup.png
        cat > AppDir/nextup.desktop << DESKTOP
        [Desktop Entry]
        Name=Nextup
        Comment=Modern debrid companion with torrent search and playlist management
        Exec=nextup
        Icon=nextup
        Type=Application
        Categories=Utility;Network;
        X-AppImage-Name=Nextup
        X-AppImage-Version=${RELEASE_TAG}
        X-AppImage-Arch=x86_64
        DESKTOP
        sed -i 's/^        //' AppDir/nextup.desktop
        cp AppDir/nextup.desktop AppDir/usr/share/applications/
        cp linux/AppRun AppDir/AppRun
        chmod +x AppDir/AppRun

        # No zsync update information: the app installs updates itself.
        APPIMAGE="nextup-${RELEASE_TAG}-x86_64.AppImage"
        ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir "$APPIMAGE"
        test -s "$APPIMAGE"
        gh release upload "$RELEASE_TAG" "$APPIMAGE" --clobber --repo "$GITHUB_REPOSITORY"
