# XcodeGen spec. Generate the project with:  brew install xcodegen && xcodegen
name: Nextup
options:
  bundleIdPrefix: com.alehaaaa
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  NextupKit:
    path: Packages/NextupKit

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # Optional: pass TMDB_READ_ACCESS_TOKEN=... to xcodebuild to bake a token in.
    TMDB_READ_ACCESS_TOKEN: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targetTemplates:
  NextupApp:
    type: application
    sources:
      - path: App
    dependencies:
      - package: NextupKit
    settings:
      base:
        PRODUCT_NAME: Nextup
        PRODUCT_BUNDLE_IDENTIFIER: com.alehaaaa.nextup.native
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO

targets:
  Nextup-iOS:
    templates: [NextupApp]
    platform: iOS
    info:
      path: Generated/Info-iOS.plist
      properties:
        CFBundleDisplayName: Nextup
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NXTMDBToken: $(TMDB_READ_ACCESS_TOKEN)
        LSApplicationCategoryType: public.app-category.entertainment
        NSAppTransportSecurity:
          # Addons, IPTV and media servers are often plain HTTP on the local network.
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: com.alehaaaa.nextup
            CFBundleURLSchemes: [nextup]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        LSApplicationQueriesSchemes: [vlc-x-callback, infuse]
        UIFileSharingEnabled: true
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"

  Nextup-macOS:
    templates: [NextupApp]
    platform: macOS
    info:
      path: Generated/Info-macOS.plist
      properties:
        CFBundleDisplayName: Nextup
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NXTMDBToken: $(TMDB_READ_ACCESS_TOKEN)
        LSApplicationCategoryType: public.app-category.entertainment
        NSAppTransportSecurity:
          # Addons, IPTV and media servers are often plain HTTP on the local network.
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: com.alehaaaa.nextup
            CFBundleURLSchemes: [nextup]
    entitlements:
      path: Generated/Nextup-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        COMBINE_HIDPI_IMAGES: YES

schemes:
  Nextup-iOS:
    build:
      targets:
        Nextup-iOS: all
  Nextup-macOS:
    build:
      targets:
        Nextup-macOS: all
